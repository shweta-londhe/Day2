<!DOCTYPE html>
<html>
<head>
<title>Smart Library Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

.panel{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#06b6d4;
    color:white;
    cursor:pointer;
    margin-top:8px;
}

button:hover{
    opacity:.9;
}

.book-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.book-card{
    background:#1e293b;
    color:white;
    padding:20px;
    border-radius:15px;
}

.book-title{
    font-size:20px;
    color:#06b6d4;
    margin-bottom:10px;
}

.available{
    background:#22c55e;
    padding:5px 10px;
    border-radius:20px;
    display:inline-block;
    margin-top:10px;
}

.borrowed{
    background:#ef4444;
    padding:5px 10px;
    border-radius:20px;
    display:inline-block;
    margin-top:10px;
}

.action-btn{
    margin-top:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:#1e293b;
    color:white;
    text-align:center;
    padding:20px;
    border-radius:15px;
}

.stat-number{
    font-size:30px;
    color:#06b6d4;
}

</style>
</head>

<body>

<div class="container">

<h1>📚 Smart Library Dashboard</h1>

<div class="panel">

<input
type="text"
id="title"
placeholder="Book Title">

<input
type="text"
id="author"
placeholder="Author Name">

<button onclick="addBook()">
Add Book
</button>

</div>

<div class="panel">

<input
type="text"
id="searchTitle"
placeholder="Search Book Title">

<button onclick="searchBook()">
Search Book
</button>

<button onclick="displayBooks()">
Show All Books
</button>

</div>

<div class="stats">

<div class="stat-card">
<div class="stat-number" id="totalBooks">0</div>
Total Books
</div>

<div class="stat-card">
<div class="stat-number" id="availableBooks">0</div>
Available
</div>

<div class="stat-card">
<div class="stat-number" id="borrowedBooks">0</div>
Borrowed
</div>

</div>

<div id="bookContainer"
class="book-grid">
</div>

</div>

<script>

let books=[];

function addBook(){

    let title=
    document.getElementById("title").value;

    let author=
    document.getElementById("author").value;

    books.push({

        id:Date.now(),

        title:title,

        author:author,

        available:true

    });

    updateStats();

    displayBooks();

}

function displayBooks(){

    let output="";

    books.forEach(book=>{

        output+=`

        <div class="book-card">

            <div class="book-title">
            ${book.title}
            </div>

            <p>
            ✍ Author:
            ${book.author}
            </p>

            <div class=
            "${book.available ?
            "available" :
            "borrowed"}">

            ${book.available ?
            "Available" :
            "Borrowed"}

            </div>

            <button
            class="action-btn"
            onclick="toggleBook(${book.id})">

            ${book.available ?
            "Borrow Book" :
            "Return Book"}

            </button>

        </div>

        `;

    });

    document.getElementById(
    "bookContainer"
    ).innerHTML=output;

}

function toggleBook(id){

    let book=
    books.find(
    b=>b.id===id);

    if(book){

        book.available=
        !book.available;

    }

    updateStats();

    displayBooks();

}

function searchBook(){

    let keyword=
    document.getElementById(
    "searchTitle"
    ).value.toLowerCase();

    let result=
    books.filter(book=>

    book.title
    .toLowerCase()
    .includes(keyword)

    );

    let output="";

    result.forEach(book=>{

        output+=`

        <div class="book-card">

            <div class="book-title">
            ${book.title}
            </div>

            <p>
            ✍ Author:
            ${book.author}
            </p>

        </div>

        `;

    });

    document.getElementById(
    "bookContainer"
    ).innerHTML=output;

}

function updateStats(){

    document.getElementById(
    "totalBooks"
    ).innerText=
    books.length;

    document.getElementById(
    "availableBooks"
    ).innerText=

    books.filter(
    b=>b.available
    ).length;

    document.getElementById(
    "borrowedBooks"
    ).innerText=

    books.filter(
    b=>!b.available
    ).length;

}

</script>

</body>
</html>
