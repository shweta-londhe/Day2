<!DOCTYPE html>
<html>
<head>
<title>Array Visualizer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0f172a;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:850px;
background:#1e293b;
padding:30px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,.4);
}

h1{
text-align:center;
color:white;
margin-bottom:25px;
}

.input-group{
display:flex;
gap:10px;
margin-bottom:20px;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#06b6d4;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}

.controls{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:15px;
}

.array-container{
margin-top:30px;
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
}

.box{
width:80px;
height:80px;
background:#334155;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:22px;
font-weight:bold;
}

.status{
margin-top:20px;
text-align:center;
color:#06b6d4;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<h1>📦 Array Visualizer</h1>

<div class="input-group">

<input
type="text"
id="value"
placeholder="Enter value">

<button onclick="addEnd()">
Add
</button>

</div>

<div class="controls">

<button onclick="addEnd()">
Push End
</button>

<button onclick="removeEnd()">
Pop End
</button>

<button onclick="addStart()">
Add Start
</button>

<button onclick="removeStart()">
Remove Start
</button>

</div>

<div id="status" class="status">
Array Ready
</div>

<div
id="arrayContainer"
class="array-container">
</div>

</div>

<script>

let arr = [10,20,30];

renderArray();

function renderArray(){

let container =
document.getElementById("arrayContainer");

container.innerHTML = "";

arr.forEach(item=>{

container.innerHTML +=
`
<div class="box">
${item}
</div>
`;

});

}

function addEnd(){

let value =
document.getElementById("value").value;

if(value==="") return;

arr.push(value);

document.getElementById("status")
.innerText =
`${value} added at end`;

renderArray();

}

function removeEnd(){

if(arr.length===0) return;

let removed = arr.pop();

document.getElementById("status")
.innerText =
`${removed} removed from end`;

renderArray();

}

function addStart(){

let value =
document.getElementById("value").value;

if(value==="") return;

arr.unshift(value);

document.getElementById("status")
.innerText =
`${value} added at beginning`;

renderArray();

}

function removeStart(){

if(arr.length===0) return;

let removed = arr.shift();

document.getElementById("status")
.innerText =
`${removed} removed from beginning`;

renderArray();

}

</script>

</body>
</html>
