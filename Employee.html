<!DOCTYPE html>
<html>
<head>
<title>Employee Directory Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

.form{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#06b6d4;
    color:white;
    cursor:pointer;
    font-size:15px;
    margin-top:8px;
}

button:hover{
    opacity:.9;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    text-align:center;
    color:white;
}

.stat-card h3{
    color:#06b6d4;
}

.stat-value{
    font-size:28px;
    margin-top:10px;
}

.employee-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.employee-card{
    background:#1e293b;
    color:white;
    padding:20px;
    border-radius:15px;
}

.employee-card h3{
    color:#06b6d4;
    margin-bottom:10px;
}

.remove-btn{
    background:#ef4444;
    margin-top:10px;
}

.search-box{
    margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<h1>👨‍💼 Employee Directory Dashboard</h1>

<div class="form">

<input type="number" id="id" placeholder="Employee ID">

<input type="text" id="name" placeholder="Employee Name">

<input type="text" id="department" placeholder="Department">

<input type="number" id="salary" placeholder="Salary">

<button onclick="addEmployee()">
Add Employee
</button>

</div>

<div class="search-box">

<input
type="number"
id="searchId"
placeholder="Search Employee By ID">

<button onclick="searchEmployee()">
Search Employee
</button>

<button onclick="displayEmployees()">
Display All Employees
</button>

</div>

<div class="stats">

<div class="stat-card">
<h3>Total Employees</h3>
<div class="stat-value" id="totalEmployees">0</div>
</div>

<div class="stat-card">
<h3>Average Salary</h3>
<div class="stat-value" id="avgSalary">₹0</div>
</div>

</div>

<div id="employeeContainer"
class="employee-grid">
</div>

</div>

<script>

let employees = [];

function addEmployee(){

    let employee = {

        id:Number(
        document.getElementById("id").value),

        name:
        document.getElementById("name").value,

        department:
        document.getElementById("department").value,

        salary:Number(
        document.getElementById("salary").value)

    };

    employees.push(employee);

    updateStats();

    displayEmployees();

}

function displayEmployees(){

    let output = "";

    employees.forEach(emp=>{

        output += `

        <div class="employee-card">

            <h3>${emp.name}</h3>

            <p><b>ID:</b> ${emp.id}</p>

            <p><b>Department:</b>
            ${emp.department}</p>

            <p><b>Salary:</b>
            ₹${emp.salary}</p>

            <button
            class="remove-btn"
            onclick="removeEmployee(${emp.id})">

            Remove

            </button>

        </div>

        `;

    });

    document.getElementById(
    "employeeContainer"
    ).innerHTML = output;

}

function removeEmployee(id){

    employees =
    employees.filter(
    emp=>emp.id!==id);

    updateStats();

    displayEmployees();

}

function searchEmployee(){

    let searchId =
    Number(
    document.getElementById(
    "searchId").value);

    let employee =
    employees.find(
    emp=>emp.id===searchId);

    if(employee){

        document.getElementById(
        "employeeContainer"
        ).innerHTML =

        `
        <div class="employee-card">

        <h3>${employee.name}</h3>

        <p><b>ID:</b>
        ${employee.id}</p>

        <p><b>Department:</b>
        ${employee.department}</p>

        <p><b>Salary:</b>
        ₹${employee.salary}</p>

        </div>
        `;

    }
    else{

        document.getElementById(
        "employeeContainer"
        ).innerHTML =

        `
        <div class="employee-card">
        Employee Not Found
        </div>
        `;
    }

}

function updateStats(){

    document.getElementById(
    "totalEmployees").innerText =
    employees.length;

    let totalSalary =
    employees.reduce(
    (sum,emp)=>
    sum + emp.salary,0);

    let avgSalary =
    employees.length
    ?
    (totalSalary /
    employees.length).toFixed(0)
    :
    0;

    document.getElementById(
    "avgSalary").innerText =
    "₹" + avgSalary;

}

</script>

</body>
</html>
